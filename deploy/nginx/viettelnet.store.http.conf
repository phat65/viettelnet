# Bootstrap only: install before requesting the first TLS certificate.
# Replace with viettelnet.store.conf after Certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name viettelnet.store;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Website setup in progress. Please try again later.\n";
    }
}
