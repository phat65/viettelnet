# Install in /etc/nginx/sites-available/viettelnet.store and enable via sites-enabled.
# This file is included inside nginx's http context (not a complete nginx.conf).
# Assumes direct DNS to this VPS. Configure trusted real IPs before adding a CDN proxy.
map $request_method $viettelnet_write_ip {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}

limit_req_zone $binary_remote_addr zone=viettelnet_requests:10m rate=20r/s;
limit_req_zone $viettelnet_write_ip zone=viettelnet_writes:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name viettelnet.store;
    server_tokens off;

    # Keep HTTP-01 available for automatic certificate renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://viettelnet.store$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name viettelnet.store;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/viettelnet.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viettelnet.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ViettelnetSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Payload limits each image to 5 MB; allow multipart metadata overhead here.
    client_max_body_size 6m;
    client_body_timeout 30s;
    limit_req_status 429;

    access_log /var/log/nginx/viettelnet.store.access.log;
    error_log /var/log/nginx/viettelnet.store.error.log warn;

    location / {
        limit_req zone=viettelnet_requests burst=60 nodelay;
        limit_req zone=viettelnet_writes burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        # The VPS is the public edge; discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Preserve Next.js streaming; do not cache authenticated/admin responses.
        proxy_buffering off;
        proxy_cache off;
    }
}
